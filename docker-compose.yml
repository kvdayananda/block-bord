services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "${APP_PORT:-8000}:80"
    environment:
      APP_NAME: "Block Bord AI"
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY:?Set APP_KEY in .env}
      APP_DEBUG: ${APP_DEBUG:-true}
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
      APP_URL: ${APP_URL:-http://127.0.0.1:${APP_PORT:-8000}}
      DB_HOST: db
      DB_DATABASE: blockbord
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      REDIS_HOST: redis
      ML_API_URL: http://ml_service:8001
      ML_API_SECRET: ${ML_API_SECRET:?Set ML_API_SECRET in .env}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      GOOGLE_SAFE_BROWSING_API_KEY: ${GOOGLE_SAFE_BROWSING_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      - db
      - redis
      - ml_service
      - clamav

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_DATABASE: blockbord
    ports:
      - "${DB_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"

  ml_service:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: always
    expose:
      - "8001"
    environment:
      ML_API_SECRET: ${ML_API_SECRET:?Set ML_API_SECRET in .env}
      ML_MODEL_PATH: /app/backend/ml/models/xgboost_phishing_v1.joblib
    volumes:
      - ./backend/ml/models:/app/backend/ml/models:ro

  clamav:
    image: clamav/clamav:stable
    restart: always
    expose:
      - "3310"
    volumes:
      - clamav_data:/var/lib/clamav

volumes:
  mysql_data:
  clamav_data:
