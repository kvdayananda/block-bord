version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8000:80"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_HOST: db
      DB_DATABASE: blockbord
      DB_USERNAME: root
      DB_PASSWORD: secret_db_password
      REDIS_HOST: redis
      ML_API_URL: http://ml_service:8001
    depends_on:
      - db
      - redis
      - ml_service

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: secret_db_password
      MYSQL_DATABASE: blockbord
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"

  ml_service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8001:8001"
    environment:
      ML_SECRET: blockbord_ml_secret_key

volumes:
  mysql_data:
