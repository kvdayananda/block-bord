services:
  - type: web
    name: block-bord-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 4 -k uvicorn.workers.UvicornWorker backend.app.main:app --bind 0.0.0.0:$PORT
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        sync: false # Set this in Render Dashboard to your Neon URL
      - key: SESSION_SECRET
        generateValue: true
      - key: BACKEND_URL
        sync: false # Set this to your Render URL (e.g., https://block-bord-api.onrender.com)
      - key: GOOGLE_SAFE_BROWSING_KEY
        sync: false # Set this in Render Dashboard
      - key: GEMINI_API_KEY
        sync: false # Set this in Render Dashboard
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: CORS_ORIGIN_REGEX
        value: https?://.*\.onrender\.com


