services:
  - type: web
    name: block-bord-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 4 -k uvicorn.workers.UvicornWorker backend.app.main:app --bind 0.0.0.0:$PORT
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: block-bord-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: BACKEND_URL
        value: https://blockbord.onrender.com
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: GOOGLE_SAFE_BROWSING_KEY
        value: AIzaSyDZ7sRRy-n1jegdOVueqz8quUvzoHAIgQo
      - key: GEMINI_API_KEY
        value: AIzaSyD_chnY-RjTOHys3ut3aCyN7BzwjJ2ae5k


