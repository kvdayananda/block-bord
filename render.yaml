services:
  - type: web
    name: block-bord-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: ML_API_URL
        value: http://block-bord-ml:10000
      - key: ML_API_SECRET
        sync: false
      - key: CLAMAV_HOST
        value: block-bord-clamav
      - key: CLAMAV_PORT
        value: "3310"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: GOOGLE_SAFE_BROWSING_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  - type: pserv
    name: block-bord-ml
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.ml.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ML_API_SECRET
        sync: false

  - type: pserv
    name: block-bord-clamav
    runtime: docker
    dockerfilePath: ./clamav/Dockerfile
    dockerContext: .
