{% extends "base.html" %}
{% block title %}Reset Password - Block Bord AI{% endblock %}

{% block content %}
<div class="auth-wrapper">

    <div class="auth-card">
        <h2>Set New Password</h2>
        <p class="auth-subtitle">Create a strong password for your account</p>

        {% if error %}
        <div class="error-box">{{ error }}</div>
        {% endif %}

        <form method="post" class="auth-form">
            <input type="hidden" name="csrf_token" value="{{ request.session.get('csrf_token') }}">

            <div class="input-group">
                <label>New Password</label>
                <input type="password" name="password" required minlength="8" placeholder="At least 8 characters">
            </div>

            <div class="input-group">
                <label>Confirm Password</label>
                <input type="password" name="confirm_password" required minlength="8" placeholder="Repeat new password">
            </div>

            <button type="submit" class="btn btn-primary btn-full">
                Reset Password
            </button>
        </form>
    </div>

</div>
{% endblock %}
