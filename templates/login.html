{% extends "base.html" %}
{% block title %}Login - Block Bord AI{% endblock %}

{% block content %}
<div class="auth-wrapper">

    <div class="auth-card">
        <h2>Welcome Back</h2>
        <p class="auth-subtitle">Sign in to your dashboard</p>

        {% if error %}
        <div class="error-box">{{ error }}</div>
        {% endif %}

        {% if message %}
        <div class="success-box">
            {{ message }}
        </div>
        {% endif %}

        <form method="post" class="auth-form">
            <input type="hidden" name="csrf_token" value="{{ request.session.get('csrf_token') }}">

            <div class="input-group">
                <label>Username</label>
                <input type="text" name="username" required>
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" name="password" required>
            </div>

            <button type="submit" class="btn btn-primary btn-full">
                Sign In
            </button>
            <div style="text-align: right; margin-top: 12px;">
                <a href="/forgot-password" style="font-size: 0.8125rem; color: var(--text-muted); text-decoration: none;">Forgot Password?</a>
            </div>
        </form>

        <div class="auth-footer">
            Don't have an account?
            <a href="/register">Create Account</a>
        </div>
    </div>

</div>
{% endblock %}
