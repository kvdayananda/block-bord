<aside class="sidebar bb-card" id="sidebar" style="border-radius: 0 24px 24px 0; height: calc(100vh - 48px); margin: 24px 0; border-left: none; width: 280px; padding: 40px 24px;">
    <div class="sidebar-top" style="margin-bottom: 48px;">
        <div class="sidebar-header-premium">
            <div class="sidebar-logo">
                <a href="/" class="logo-link" style="font-size: 1.4rem;">
                    <img src="/static/logo.png" alt="Block Bord Logo" style="width: 32px; filter: drop-shadow(0 0 8px var(--primary-glow));">
                    <span>Block <span style="color: var(--primary);">Bord</span></span>
                </a>
            </div>
            
            {% if user %}
            <div class="plan-badge-premium {{ 'pro' if user.is_pro else 'free' }}" style="margin-top: 16px; width: 100%; justify-content: center; background: var(--surface-alt); border: 1px solid var(--border); padding: 10px; border-radius: 12px; font-size: 0.75rem; font-weight: 800; letter-spacing: 0.05em; color: var(--text);">
                {{ '💎 PRO TERMINAL' if user.is_pro else '🛡️ FREE NODE' }}
            </div>
            {% endif %}
        </div>
    </div>

    <nav class="sidebar-nav" style="display: flex; flex-direction: column; gap: 6px;">
        <a href="/app" class="sidebar-link {% if request.url.path == '/app' %}active{% endif %}">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
            Analyzer
        </a>
        <a href="/history" class="sidebar-link {% if request.url.path == '/history' %}active{% endif %}">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
            Forensics
        </a>
        <a href="/block-list" class="sidebar-link {% if request.url.path == '/block-list' %}active{% endif %}">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
            Block List
        </a>
        
        <div style="margin: 24px 0 12px; padding: 0 16px; font-size: 0.7rem; font-weight: 800; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.1em;">Tools</div>
        
        <a href="/leak-checker" class="sidebar-link {% if request.url.path == '/leak-checker' %}active{% endif %}">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
            Leak Scan
        </a>
        <a href="/scam-map" class="sidebar-link {% if request.url.path == '/scam-map' %}active{% endif %}">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path><path d="M2 12h20"></path></svg>
            Threat Map
        </a>

        <div style="margin-top: auto; padding-top: 24px; border-top: 1px solid var(--border);">
            <a href="/settings" class="sidebar-link {% if request.url.path == '/settings' %}active{% endif %}">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                Settings
            </a>
            <a href="/logout" class="sidebar-link" style="color: var(--status-danger);">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                Logout
            </a>
        </div>
    </nav>
</aside>

<style>
.sidebar-link {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border-radius: 12px;
    color: var(--text-muted);
    font-weight: 700;
    transition: var(--transition);
    font-size: 0.9rem;
}

.sidebar-link svg {
    opacity: 0.7;
    transition: var(--transition);
}

.sidebar-link:hover {
    background: var(--surface-alt);
    color: var(--text);
}

.sidebar-link:hover svg {
    opacity: 1;
    color: var(--primary);
}

.sidebar-link.active {
    background: var(--primary-grad);
    color: white;
    box-shadow: 0 4px 12px var(--primary-glow);
}

.sidebar-link.active svg {
    opacity: 1;
    color: white;
}
</style>

<script>
(function() {
    const toggle = document.getElementById('sidebarToggle');
    const nav = document.getElementById('sidebarNav');
    const overlay = document.getElementById('mobileOverlay');
    
    function checkMobile() {
        if (window.innerWidth <= 1024) {
            toggle.style.display = 'flex';
        } else {
            toggle.style.display = 'none';
            nav.classList.remove('mobile-open');
            overlay.classList.remove('active');
            document.body.style.overflow = '';
        }
    }

    window.toggleMobileNav = function() {
        console.log('[BlockBord] Toggling Mobile Nav');
        const isOpen = nav.classList.toggle('mobile-open');
        overlay.classList.toggle('active');
        document.body.style.overflow = isOpen ? 'hidden' : '';
    };

    window.addEventListener('resize', checkMobile);
    document.addEventListener('DOMContentLoaded', checkMobile);
    checkMobile();
})();
</script>
