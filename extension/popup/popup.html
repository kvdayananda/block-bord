<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Block Bord AI</title>
  <link rel="stylesheet" href="popup.css" />
  <style>
    :root {
      --bg: #ffffff;
      --bg-alt: #f8fafc;
      --primary: #6366f1;
      --primary-grad: linear-gradient(135deg, #6366f1, #a855f7);
      --danger: #ef4444;
      --warn: #f59e0b;
      --safe: #10b981;
      --text: #0f172a;
      --muted: #64748b;
      --border: rgba(15, 23, 42, 0.08);
      --radius: 12px;
      --radius-sm: 8px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; width: 340px; min-height: 480px; }
    .popup { display: flex; flex-direction: column; min-height: 100vh; }
    
    /* Header */
    .bb-header { display: flex; align-items: center; justify-content: space-between; padding: 16px; border-bottom: 1px solid var(--border); }
    .bb-logo { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 0.95rem; }
    .bb-logo svg { color: var(--primary); }
    .bb-logo span { color: var(--text); }
    .bb-grad { background: var(--primary-grad); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    
    .badge-status { font-size: 0.65rem; padding: 4px 10px; border-radius: 20px; font-weight: 700; text-transform: uppercase; }
    .badge-status.online { background: rgba(16, 185, 129, 0.1); color: var(--safe); }
    .badge-status.offline { background: rgba(239, 68, 68, 0.1); color: var(--danger); }

    /* Current page scan result */
    .scan-result-card { margin: 16px 16px 0; padding: 18px; border-radius: var(--radius); border: 1px solid var(--border); position: relative; }
    .scan-result-card.safe { background: rgba(16, 185, 129, 0.05); border-color: rgba(16, 185, 129, 0.15); }
    .scan-result-card.suspicious { background: rgba(245, 158, 11, 0.05); border-color: rgba(245, 158, 11, 0.15); }
    .scan-result-card.high { background: rgba(239, 68, 68, 0.05); border-color: rgba(239, 68, 68, 0.15); }
    .scan-result-card.scanning { background: rgba(99, 102, 241, 0.05); border-color: rgba(99, 102, 241, 0.15); }
    
    .result-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 8px; font-weight: 600; }
    .result-score { font-size: 2.75rem; font-weight: 900; line-height: 1; letter-spacing: -0.02em; }
    .result-score.safe { color: var(--safe); }
    .result-score.suspicious { color: var(--warn); }
    .result-score.high { color: var(--danger); }
    .result-score.scanning { color: var(--primary); }
    
    .result-level { font-size: 0.85rem; font-weight: 700; margin-top: 4px; }
    .result-domain { font-size: 0.75rem; color: var(--muted); margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0.8; }
    .result-category { font-size: 0.7rem; margin-top: 8px; padding: 4px 10px; border-radius: 20px; display: inline-block; background: var(--bg-alt); color: var(--text); font-weight: 600; border: 1px solid var(--border); }
    
    .status-icon { position: absolute; top: 18px; right: 18px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
    .status-icon.safe { color: var(--safe); background: rgba(16, 185, 129, 0.1); }
    .status-icon.suspicious { color: var(--warn); background: rgba(245, 158, 11, 0.1); }
    .status-icon.high { color: var(--danger); background: rgba(239, 68, 68, 0.1); }
    .status-icon.scanning { color: var(--primary); background: rgba(99, 102, 241, 0.1); }

    /* Unified Button Pattern */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 700; font-size: 0.85rem; padding: 10px 16px; border-radius: var(--radius-sm); border: none; cursor: pointer; transition: all 0.2s; font-family: inherit; }
    .btn-primary { background: var(--primary-grad); color: white; width: calc(100% - 32px); margin: 12px 16px 0; box-shadow: 0 4px 10px rgba(99, 102, 241, 0.2); }
    .btn-primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 14px rgba(99, 102, 241, 0.3); }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Stats */
    .bb-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 16px 16px 0; }
    .stat-cell { background: var(--bg-alt); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 8px; text-align: center; }
    .stat-val { font-size: 1.25rem; font-weight: 800; }
    .stat-val.red { color: var(--danger); }
    .stat-val.orange { color: var(--warn); }
    .stat-val.green { color: var(--safe); }
    .stat-lbl { font-size: 0.6rem; color: var(--muted); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }

    /* Recent scans */
    .section-title { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); padding: 16px 16px 8px; font-weight: 700; }
    .scan-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; border-top: 1px solid var(--border); }
    .scan-item:last-child { border-bottom: 1px solid var(--border); }
    .scan-item-url { font-size: 0.75rem; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
    .scan-pill { font-size: 0.6rem; padding: 3px 10px; border-radius: 20px; font-weight: 800; text-transform: uppercase; }
    .pill-safe { background: rgba(16, 185, 129, 0.1); color: var(--safe); }
    .pill-suspicious { background: rgba(245, 158, 11, 0.1); color: var(--warn); }
    .pill-high { background: rgba(239, 68, 68, 0.1); color: var(--danger); }

    /* Footer */
    .bb-footer { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: var(--bg-alt); border-top: 1px solid var(--border); margin-top: auto; }
    .bb-footer a { font-size: 0.72rem; color: var(--primary); text-decoration: none; font-weight: 700; }
    .bb-footer-ver { font-size: 0.65rem; color: var(--muted); font-weight: 500; }

    /* Scan Details Collapsible */
    .details-toggle { margin: 8px 16px; font-size: 0.7rem; color: var(--primary); font-weight: 700; cursor: pointer; display: none; align-items: center; gap: 4px; text-decoration: underline; }
    .scan-details { margin: 0 16px 16px; padding: 12px; background: var(--bg-alt); border-radius: var(--radius-sm); border: 1px solid var(--border); display: none; }
    .details-title { font-size: 0.65rem; font-weight: 800; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
    .details-list { list-style: none; }
    .details-list li { font-size: 0.72rem; color: var(--text); padding: 4px 0; border-bottom: 1px solid rgba(0,0,0,0.03); display: flex; align-items: flex-start; gap: 6px; }
    .details-list li::before { content: "•"; color: var(--primary); font-weight: bold; }
    .details-list li:last-child { border-bottom: none; }
  </style>
</head>
<body>
  <div class="popup">
    <!-- Header -->
    <header class="bb-header">
      <div class="bb-logo">
        <img src="../icons/icon48.png" alt="Logo" style="width: 20px; height: 20px;">
        <span style="text-decoration: none; color: inherit; display: flex; align-items: center;">
          Block <span class="bb-logo-blue" style="margin-left: 4px; color: var(--primary);">Bord</span>
          <span id="user-tier-badge" style="display:none; font-size: 0.58rem; padding: 1px 5px; border-radius: 4px; font-weight: 800; background: linear-gradient(135deg, #f59e0b, #d97706); color: #fff; margin-left: 6px;">FREE</span>
        </span>
      </div>
      <div class="badge-status offline" id="status-badge">● Offline</div>
    </header>

    <!-- Current Page Result -->
    <div class="scan-result-card scanning" id="result-card">
      <div class="result-label">Current Page Threat Level</div>
      <div class="result-score scanning" id="result-score">--</div>
      <div class="result-level" id="result-level">Scanning…</div>
      <div class="result-domain" id="result-domain">Loading…</div>
      <div class="result-category" id="result-category"></div>
      <div id="status-icon" class="status-icon scanning">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
      </div>
    </div>

    <!-- Scan Details Toggle -->
    <div id="details-toggle" class="details-toggle">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
      Why this score? View scan details
    </div>

    <!-- Collapsible Details Section -->
    <div id="scan-details" class="scan-details">
      <div class="details-title">AI Threat Analysis Details</div>
      <ul id="details-list" class="details-list">
        <!-- populated by js -->
      </ul>
    </div>

    <!-- Manual Scan Button -->
    <button class="btn btn-primary" id="btn-manual-scan">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom:-2px; margin-right:4px;"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      Scan This Page Now
    </button>

    <!-- Stats Row (Feature #15, #92) -->
    <div class="bb-stats">
      <div class="stat-cell">
        <div class="stat-val" id="stat-total">0</div>
        <div class="stat-lbl">Scanned</div>
      </div>
      <div class="stat-cell">
        <div class="stat-val orange" id="stat-suspicious">0</div>
        <div class="stat-lbl">Suspicious</div>
      </div>
      <div class="stat-cell">
        <div class="stat-val red" id="stat-blocked">0</div>
        <div class="stat-lbl">Blocked</div>
      </div>
    </div>

    <!-- Recent History -->
    <div class="section-title">Recent Scans</div>
    <div id="recent-list"></div>

    <!-- Footer -->
    <footer class="bb-footer">
      <a href="http://127.0.0.1:8000/app" target="_blank">Dashboard</a>
      <span class="bb-footer-ver">v2.0.0</span>
      <a href="http://127.0.0.1:8000/admin" target="_blank">Scan History</a>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
